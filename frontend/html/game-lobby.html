<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../css/game-lobby.css">
    <script type="module" src="../javascript/game/game-lobby.js"></script>
    <script type="module" src="/javascript/libs/utils/navbar.js"></script>
    <title>Pályaválasztás</title>
</head>

<body>
    <div id="navbar-mount"></div>
    <div class="d-flex justify-content-center align-items-center mt-4">
        <div class="d-flex align-items-center colDiv flex-column glass">
            <div class="d-flex p-2 pb-0 w-100 gap-2 tabRow">
                <button class="btnStyle btnPushed" id="tabAll" data-i18n="game-maps:choosing.tabs.all">Összes</button>
                <button class="btnStyle" id="tabMine" data-i18n="game-maps:choosing.tabs.mine">Saját játékaim</button>
            </div>
            <div class="d-flex p-2 pb-0 w-100">
                <h3 class="mb-0" data-i18n="game-maps:choosing.sorting.label">Rendezés:</h3>
            </div>
            <div class="d-flex align-items-center w-100 p-2 pb-0 gap-3 flex-wrap flex justify-content-center">
                <div class="d-flex gap-3 justify-content-center sortDiv">
                    <button class="btnStyle btnPushed" id="sortByPlays"
                        data-i18n="game-maps:choosing.sorting.plays">Játékok
                        száma</button>
                    <button class="btnStyle" id="sortByRating"
                        data-i18n="game-maps:choosing.sorting.rating">Értékelés</button>
                </div>
                <div class="d-flex gap-3 justify-content-center sortDiv">
                    <button class="btnStyle" id="sortByCreated"
                        data-i18n="game-maps:choosing.sorting.created">Létrehozás
                        dátuma</button>
                    <button class="btnStyle" id="sortByFavorites"
                        data-i18n="game-maps:choosing.sorting.favorites">Kedvencek</button>
                </div>
            </div>
            <div class="d-flex p-2 pb-0 w-100">
                <h3 class="mb-0" data-i18n="game-maps:choosing.mapsLabel">Pályák:</h3>
            </div>
            <div class="card-container p-3" id="game_maps_container"></div>
            <div class="d-flex justify-content-center w-100 p-3">
                <button class="btnStyle" id="loadMoreBtn" data-i18n="game-maps:choosing.loadMore">További pályák
                    betöltése</button>
            </div>
        </div>

    </div>
    <div id="toastPlace" class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-4"></div>
</body>

</html>
