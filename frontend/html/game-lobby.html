<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../css/game-lobby.css">
    <script type="module" src="../javascript/game/game-lobby.js"></script>
    <title>Pályaválasztás</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark glass">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> <!-- Főoldalt be kell majd linkelni -->
                <img src="../images/lokea.webp" alt="Lokea logo" class="navPic">
            </a>
            <div class="dropdown">
                <a href="#" class="d-block link-light text-decoration-none dropdown-toggle">
                    <!-- Profiloldal belinkelése -->
                    <img src="../images/default.png" alt="profPic" class="rounded-circle border border-2 navPic">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small">
                    <li><a class="dropdown-item" href="#">Profile</a></li> <!-- Profiloldal belinkelése -->
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item text-danger" href="#">Sign out</a></li>
                    <!-- Kijelentkezés funkció implementálása -->
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex justify-content-center align-items-center mt-4">
        <div class="d-flex align-items-center colDiv flex-column glass">
            <div class="d-flex p-2 pb-0 w-100 gap-2 tabRow">
                <button class="btnStyle btnPushed" id="tabAll">Összes</button>
                <button class="btnStyle" id="tabMine">Saját játékaim</button>
            </div>
            <div class="d-flex p-2 pb-0 w-100">
                <h3 class="mb-0">Rendezés:</h3>
            </div>
            <div class="d-flex align-items-center w-100 p-2 pb-0 gap-3 flex-wrap flex justify-content-center">
                <div class="d-flex gap-3 justify-content-center sortDiv">
                    <button class="btnStyle btnPushed" id="sortByPlays">Játékok száma</button>
                    <button class="btnStyle" id="sortByRating">Értékelés</button>
                </div>
                <div class="d-flex gap-3 justify-content-center sortDiv">
                    <button class="btnStyle" id="sortByCreated">Létrehozás dátuma</button>
                    <button class="btnStyle" id="sortByFavorites">Kedvencek</button>
                </div>
            </div>
            <div class="d-flex p-2 pb-0 w-100">
                <h3 class="mb-0">Pályák:</h3>
            </div>
            <div class="card-container p-3" id="game_maps_container"></div>
            <div class="d-flex justify-content-center w-100 p-3">
                <button class="btnStyle" id="loadMoreBtn">További pályák betöltése</button>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="myModal">
        <div class="modal-box">
            <span class="modal-close-btn">&times;</span>
            <div class="modal-header-block">
                <h3 id="modal-title"></h3>
                <div class="stars" id="modal-stars"></div>
                <p id="modal-desc"></p>
            </div>

            <form id="settingsForm" class="settings-form" novalidate>
                <div class="settings-grid">
                    <label for="rounds">Körök száma:</label>
                    <input name="rounds" type="number" id="rounds" min="1" max="100" value="5">

                    <label for="difficulty">Nehézség:</label>
                    <select name="difficulty" id="difficulty">
                        <option value="easy">Könnyű</option>
                        <option value="normal">Közepes</option>
                        <option value="hard">Nehéz</option>
                    </select>

                    <label for="times">Egy kör időtartama:</label>
                    <div class="time-row">
                        <input name="roundTime" type="range" id="times" min="1" max="300" step="1" value="30">
                        <output id="timesValue" for="times">00:30</output>
                    </div>
                </div>

                <div class="max-rounds-info" id="maxRoundsInfo">
                    <p class="info-title">Ismétlés nélküli max kör: <strong id="maxUniqueRounds">-</strong></p>
                    <p class="info-desc">A körszám nincs ehhez limitálva, a pontok újrajátszhatók.</p>
                </div>

                <button type="submit" class="btn btn-light start-btn" id="startGame">Játék indítása</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="continueGameModal">
        <div class="modal-box">
            <h3 id="continue-modal-title">Van egy elindított játékod</h3>
            <p id="continue-modal-desc">Szeretnéd folytatni az elkezdett játékodat? Ha nem folytatod, akkor többet nem tudod folytatni.</p>
            <div class="d-flex justify-content-center gap-3 flex-wrap mt-3">
                <button class="btn btn-light" id="continueGameBtn">Folytatás</button>
                <button class="btn btn-outline-light" id="dismissContinueBtn">Játék befejezése</button>
            </div>
        </div>
    </div>
    <div id="toastPlace" class="toast-container position-fixed bottom-0 start-50 translate-middle-x mb-4"></div>
</body>

</html>
