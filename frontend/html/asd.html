<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cards with Ratings</title>
    <style>
        .card-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 50px;
            flex-wrap: wrap;
            font-family: sans-serif;
        }

        .card {
            width: 200px;
            height: 400px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .card-content {
            padding: 20px;
            color: white;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            width: 100%;
            box-sizing: border-box;
        }

        .card-title {
            margin: 0;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        /* --- NEW STAR CSS --- */
        .stars {
            display: inline-block;
            font-size: 18px; 
            font-family: Times; 
            line-height: 1;
            margin-bottom: 5px;
        }

        .stars::before {
            content: '★★★★★'; 
            /* Multiplies the number by 10%. So 8.5 becomes 85% */
            background: linear-gradient(90deg, #ffc107 calc(var(--rating) * 10%), #bbb calc(var(--rating) * 10%));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* -------------------- */

        .card-desc {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .card-1 { background-image: url('https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80'); }
        .card-2 { background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80'); }
        .card-3 { background-image: url('https://images.unsplash.com/photo-1501854140884-074bf6fca01d?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80'); }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- Card 1: Rated 9.5 -->
        <div class="card card-1">
            <div class="card-content">
                <h3 class="card-title">Mountain View</h3>
                <!-- Set Rating Here -->
                <div class="stars" style="--rating: 9.5;" aria-label="Rating of 9.5 out of 10"></div>
                <p class="card-desc">Highest peaks.</p>
            </div>
        </div>

        <!-- Card 2: Rated 7.0 -->
        <div class="card card-2">
            <div class="card-content">
                <h3 class="card-title">Deep Forest</h3>
                <!-- Set Rating Here -->
                <div class="stars" style="--rating: 7.0;" aria-label="Rating of 7.0 out of 10"></div>
                <p class="card-desc">Lush greenery.</p>
            </div>
        </div>

        <!-- Card 3: Rated 4.2 -->
        <div class="card card-3">
            <div class="card-content">
                <h3 class="card-title">Ocean Blue</h3>
                <!-- Set Rating Here -->
                <div class="stars" style="--rating: 4.2;" aria-label="Rating of 4.2 out of 10"></div>
                <p class="card-desc">Deep waters.</p>
            </div>
        </div>

    </div>

</body>
</html>
