<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--!Bootstrap-->
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <!--?Popper: dropdowns, popovers, tooltips-->
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../css/game-choosing.css">
    <script src="../javascript/game/game-choosing.js"></script>
    <title>Pályaválasztás</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark glass">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="../images/lokea.png" alt="Lokea logo" class="navPic">
            </a>
            <div class="dropdown">
                <a href="#" class="d-block link-light text-decoration-none dropdown-toggle">
                    <img src="../images/default.png" alt="profPic" class="rounded-circle border border-2 navPic">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small">
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item text-danger" href="#">Sign out</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex justify-content-center align-items-center mt-4">
        <div class="d-flex align-items-center colDiv flex-column glass">
            <div class="d-flex p-2 pb-0 w-100">
                <h3 class="mb-0">Rendezés:</h3>
            </div>
            <div class="d-flex align-items-center w-100 p-2 pb-0 gap-3 flex-wrap flex justify-content-center">
                <div class="d-flex gap-3 justify-content-center">
                    <button class="btnStyle btnPushed" id="sortByCreated">Létrehozás dátuma</button>
                    <button class="btnStyle" id="sortByRating">Értékelés</button>
                </div>
                <div class="d-flex gap-3 justify-content-center">
                    <button class="btnStyle" id="sortByPlays">Játékok száma</button>
                    <button class="btnStyle" id="sortByFavorites" disabled>Kedvencek</button>
                </div>
            </div>
            <div class="d-flex p-2 pb-0 w-100">
                <h3 class="mb-0">Pályák:</h3>
            </div>
            <div class="card-container p-3" id="game_maps_container"></div>
        </div>

    </div>

    <div class="modal-overlay" id="myModal">
        <div class="modal-box">
            <span class="modal-close-btn">&times;</span>
            <h3 id="modal-title"></h3>
            <div class="stars" id="modal-stars"></div>
            <p id="modal-desc"></p>
            <button class="btn btn-light">Játék indítása</button>
        </div>
    </div>
</body>

</html>
