<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../css/game-map-base.css">
    <link rel="stylesheet" href="../css/game-lobby.css">
    <link rel="stylesheet" href="../css/game-page.css">
    <script type="module" src="../javascript/game/game_page.js"></script>
    <title>Lokea</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark glass">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="../images/lokea.webp" alt="Lokea logo" class="navPic">
            </a>
            <div class="dropdown">
                <a href="#" class="d-block link-light text-decoration-none dropdown-toggle">
                    <img src="../images/default.png" alt="profPic" class="rounded-circle border border-2 navPic">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small">
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#">Sign out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="gameContainer">
        <div id="countdownOverlay" class="countdown-overlay">
            <span id="countdownNumber"></span>
        </div>

        <div id="errorOverlay" class="error-overlay">
            <div id="errorBox">
                <p class="panel-label">Hiba</p>
                <p id="errorMessage"></p>
                <button class="btn-next-round" onclick="location.href='/game-maps'">Vissza a játékválasztó oldalra</button>
            </div>
        </div>

        <div class="d-flex" id="gameViewport">
            <div id="pictureWrapper">
                <canvas id="pictureCanvas"></canvas>

                <div id="mapWrapper">
                    <canvas id="mapCanvas"></canvas>
                    <button class="map-side-btn map-prev" id="mapPrevBtn" title="Előző térkép">
                        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <button class="map-side-btn map-next" id="mapNextBtn" title="Következő térkép">
                        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                    <div id="mapControls">
                        <button class="map-btn" onclick="mapFullScreen()" title="Teljes képernyő">
                            <svg><use href="../images/icons/game-icons.svg#fullscreen"/></svg>
                        </button>
                    </div>
                </div>

                <div id="sidebar">
                    <button class="icon-btn" id="pictureFullScreenBtn" onclick="pictureFullScreen()" title="Teljes képernyő">
                        <svg><use href="../images/icons/game-icons.svg#fullscreen"/></svg>
                    </button>
                    <label class="icon-btn" id="autoRotateBtn" title="Automatikus forgatás">
                        <input type="checkbox" id="autoRotate" hidden>
                        <svg><use href="../images/icons/game-icons.svg#auto-rotate"/></svg>
                    </label>
                </div>

                <div id="timerDisplay">
                    <span id="timer">--</span>
                </div>

                <div id="bottomBar">
                    <div id="bottomRight">
                        <div id="roundCounter">
                            <span id="mapName" title="Térkép"><svg><use href="../images/icons/game-icons.svg#map"/></svg><span id="mapTitle">-</span></span>
                            <span id="roundCount">Kör: <span id="currentRound">-</span> / <span id="totalRounds">-</span></span>
                        </div>
                        <button class="btn-guess" id="guessBtn" onclick="sendGuess()">
                            <svg><use href="../images/icons/game-icons.svg#guess"/></svg>
                            Tipp leadása
                        </button>
                    </div>
                </div>
            </div>

            <div id="guessPanel">
                <div class="panel-content" id="roundResultContent">
                    <p class="panel-label">Pontszám</p>
                    <h2 id="guessPanelScore">0</h2>
                    <p id="guessPanelDistance"></p>
                    <hr class="panel-divider">
                    <p class="panel-label">Összesített pontszám</p>
                    <h4 id="guessPanelTotal">0</h4>
                    <button class="btn-next-round" id="nextRoundBtn" onclick="nextRound()">Következő kör</button>
                </div>
                <div id="gameOverContent">
                    <div id="gameOverInner">
                        <p class="panel-label">Játék vége</p>
                        <h1 id="finalScore">0</h1>
                        <p class="panel-label">Végső pontszám</p>

                        <hr class="panel-divider">

                        <div class="gameover-columns">
                            <div class="gameover-left">
                                <div id="gameoverFormState">
                                    <p class="panel-label">Értékeld a pályát</p>
                                    <fieldset class="gameover-rating-group">
                                        <div class="gameover-rating-input">
                                            <input type="radio" id="goStar5" name="gameOverRating" value="5">
                                            <label for="goStar5" aria-label="5 csillag">&#9733;</label>
                                            <input type="radio" id="goStar4" name="gameOverRating" value="4">
                                            <label for="goStar4" aria-label="4 csillag">&#9733;</label>
                                            <input type="radio" id="goStar3" name="gameOverRating" value="3">
                                            <label for="goStar3" aria-label="3 csillag">&#9733;</label>
                                            <input type="radio" id="goStar2" name="gameOverRating" value="2">
                                            <label for="goStar2" aria-label="2 csillag">&#9733;</label>
                                            <input type="radio" id="goStar1" name="gameOverRating" value="1">
                                            <label for="goStar1" aria-label="1 csillag">&#9733;</label>
                                        </div>
                                    </fieldset>
                                    <textarea id="gameoverCommentText" class="gameover-comment-input" rows="3" maxlength="255" placeholder="Írd le a véleményed (opcionális)..."></textarea>
                                    <button class="btn-next-round" id="submitRatingBtn">Értékelés küldése</button>
                                    <button id="cancelCommentEditBtn" class="btn-next-round gameover-back-btn" style="display:none;">Mégse</button>
                                </div>

                                <div id="gameoverViewState" class="gameover-view-state" style="display:none;">
                                    <p class="panel-label">A te értékelésed</p>
                                    <div id="gameoverUserRating" class="rating-stars gameover-user-stars" style="--rating: 0;"></div>
                                    <p id="gameoverUserText" class="gameover-user-text"></p>
                                    <div class="gameover-comment-buttons">
                                        <button id="editCommentBtn" class="btn-next-round gameover-back-btn">Szerkesztés</button>
                                        <button id="deleteCommentBtn" class="btn-next-round gameover-delete-btn">Törlés</button>
                                    </div>
                                </div>

                                <button class="btn-next-round gameover-back-btn" onclick="location.href='/game-maps'">Vissza a főoldalra</button>
                            </div>

                            <div class="gameover-comments-col">
                                <p class="panel-label">Értékelések</p>
                                <div id="gameOverComments" class="gameover-comments-list"></div>
                            </div>

                            <div class="gameover-right">
                                <p class="panel-label">Rangsor</p>
                                <div id="gameOverLeaderboard" class="gameover-leaderboard"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
