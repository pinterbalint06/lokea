<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/game-page.css">
    <script type="module" src="../javascript/game/game_page.js"></script>
    <title>Játék</title> <!--A cím megváltoztatása a játék nevére -->
</head>

<body>
    <div class="">
        <div class="">
            <div class="">
                <div>
                    <div class="">
                        <button onclick="pictureFullScreen();">Teljes képernyő</button>
                        <button onclick="clearImage();">Clear</button>
                        <button onclick="startGame();">Játék indítása</button>
                    </div>
                    <div class="">
                        <label for="autoRotate">Automatikus forgatás:</label>
                        <input type="checkbox" name="autoRotate" id="autoRotate">
                    </div>
                    <div class="">
                        <button onclick="mapFullScreen();">Teljes képernyő</button>
                        <button onclick="sendGuess();">Térképjelölő helye</button>
                        <button onclick="nextMap();">Következő</button>
                        <p id="timer"></p>
                        <button onclick="nextRound()">Következő kör</button>
                    </div>
                </div>
            </div>
            <div class="" id="pictureWrapper">
                <div id="countdownOverlay" class="countdown-overlay">
                    <span id="countdownNumber"></span>
                </div>
                <canvas id="pictureCanvas" class="canvasborder"></canvas>
                <canvas id="mapCanvas" class="canvasborder"></canvas>
            </div>
        </div>
    </div>
</body>

</html>
