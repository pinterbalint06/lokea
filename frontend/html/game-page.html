<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <script src="../bootstrap/js/popper.min.js"></script>
    <script src="../bootstrap/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="../css/game-choosing.css">
    <link rel="stylesheet" href="../css/game-page.css">
    <script type="module" src="../javascript/game/game_page.js"></script>
    <title>Lokea</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark glass">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="../images/lokea.png" alt="Lokea logo" class="navPic">
            </a>
            <div class="dropdown">
                <a href="#" class="d-block link-light text-decoration-none dropdown-toggle">
                    <img src="../images/default.png" alt="profPic" class="rounded-circle border border-2 navPic">
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-small">
                    <li><a class="dropdown-item" href="#">Profile</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#">Sign out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div id="gameContainer">
        <div id="countdownOverlay" class="countdown-overlay">
            <span id="countdownNumber"></span>
        </div>

        <div class="d-flex" id="gameViewport">
            <div id="pictureWrapper">
                <canvas id="pictureCanvas"></canvas>

                <div id="mapWrapper">
                    <canvas id="mapCanvas"></canvas>
                    <button class="map-side-btn map-prev" onclick="cycleMaps(-1)" title="Előző térkép">
                        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <button class="map-side-btn map-next" onclick="cycleMaps(1)" title="Következő térkép">
                        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                    <div id="mapControls">
                        <button class="map-btn" onclick="mapFullScreen()" title="Teljes képernyő">
                            <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                        </button>
                    </div>
                </div>

                <div id="sidebar">
                    <button class="icon-btn" onclick="pictureFullScreen()" title="Teljes képernyő">
                        <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                    </button>
                    <label class="icon-btn" id="autoRotateBtn" title="Automatikus forgatás">
                        <input type="checkbox" id="autoRotate" hidden>
                        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5.36L1 10"/></svg>
                    </label>
                </div>

                <div id="timerDisplay">
                    <span id="timer">--</span>
                </div>

                <div id="bottomBar">
                    <div id="bottomRight">
                        <div id="roundCounter">
                            <span id="mapName">Térkép: <span id="mapTitle">-</span></span>
                            <span id="roundCount">Kör: <span id="currentRound">-</span> / <span id="totalRounds">-</span></span>
                        </div>
                        <button class="btn-guess" onclick="sendGuess()">
                            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            Tipp leadása
                        </button>
                    </div>
                </div>
            </div>

            <div id="guessPanel">
                <div class="panel-content" id="roundResultContent">
                    <p class="panel-label">Pontszám</p>
                    <h2 id="guessPanelScore">0</h2>
                    <p id="guessPanelDistance"></p>
                    <hr class="panel-divider">
                    <p class="panel-label">Összesített pontszám</p>
                    <h4 id="guessPanelTotal">0</h4>
                    <button class="btn-next-round" onclick="nextRound()">Következő kör</button>
                </div>
                <div id="gameOverContent">
                    <div id="gameOverInner">
                        <p class="panel-label">Játék vége</p>
                        <h1 id="finalScore">0</h1>
                        <p class="panel-label">Végső pontszám</p>
                        <button class="btn-next-round" onclick="location.href='/choose_game'">Vissza a főoldalra</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="devControls">
            <button onclick="startGame()">Start</button>
            <button onclick="clearImage()">Clear</button>
        </div>
    </div>
</body>

</html>
