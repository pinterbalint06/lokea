<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/game-page.css">
    <script type="module" src="../javascript/game/game_page.js"></script>
    <title>Játék</title> <!--A cím megváltoztatása a játék nevére -->
</head>

<body>
    <!--Beállítások a játékhoz: körök száma(jelölni a különböző pályák számát a, de ne korlátozni), idő adott körre, esetleg nehézség megcsinálása -->
    <div id="settings">
        <form action="" id="settingsForm">
            <h1>Nem található játék</h1>
            <p id="gametitle">Nem található leírás</p>
            <label for="rounds">Körök száma:</label>
            <input type="number" id="rounds" min="1" max="100" value="5">
            <label for="difficulty">Nehézség:</label>
            <select name="difficulty" id="difficulty">
                <option value="easy">Könnyű</option>
                <option value="medium">Közepes</option>
                <option value="hard">Nehéz</option>
            </select>
            <label for="times">Egy kör időtartama:</label>
            <input type="range" id="times" min="1" max="300" step="1" value="30">
            <output id="timesValue" for="times">00:30</output>
            <button type="submit">Játék indítása</button>
        </form>
    </div>
    <div class="row w100 around wrapreverse">
        <div class="col wrap gap">
            <div class="col center">
                <div>
                    <p>FPS: <span id="fps"></span></p>
                    <div>
                        <label for="kepek">Képek: </label>
                        <select name="kepek" id="kepek">
                        </select>
                    </div>
                    <div class="row center">
                        <button onclick="pictureFullScreen();">Teljes képernyő</button>
                        <button onclick="clearImage();">Clear</button>
                    </div>
                    <div class="row center">
                        <label for="autoRotate">Automatikus forgatás:</label>
                        <input type="checkbox" name="autoRotate" id="autoRotate">
                    </div>
                </div>
            </div>
            <div class="col">
                <canvas id="pictureCanvas" class="canvasborder"></canvas>
            </div>
        </div>
    </div>
    <div class="row w100 around wrapreverse">
        <div class="col wrap gap">
            <div class="col center">
                <div>
                    <p>FPS: <span id="fps"></span></p>
                    <div class="row center">
                        <button onclick="mapFullScreen();">Teljes képernyő</button>
                        <button onclick="markerPosition();">Térképjelölő helye</button>
                        <button onclick="nextMap();">Következő</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <canvas id="mapCanvas" class="canvasborder"></canvas>
            </div>
        </div>
    </div>
</body>

</html>
